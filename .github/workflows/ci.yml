name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rd
          POSTGRES_PASSWORD: rd
          POSTGRES_DB: rd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rd -d rd_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://rd:rd@localhost:5432/rd_test
      DATABASE_URL: postgresql+asyncpg://rd:rd@localhost:5432/rd_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Migrations apply and match models
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rd-notify:ci .
