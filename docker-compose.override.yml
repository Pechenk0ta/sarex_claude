# Development overrides, loaded automatically by `docker compose up`.

services:
  db:
    ports:
      - "5432:5432"

  app:
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./app:/srv/app
      - ./migrations:/srv/migrations

  worker:
    volumes:
      - ./app:/srv/app

  # Local mailbox: every outgoing email lands here, web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  caddy:
    profiles: ["prod"]
